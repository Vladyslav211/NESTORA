<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Checkout — NESTORA.</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/checkout.css" />
    <link rel="stylesheet" href="./css/main.css" />
  </head>

  <body>
    <main class="checkout">
      <div class="container checkout__container">
        <a class="checkout__logo" href="index.html"> NESTORA. </a>

        <div class="checkout__layout">
          <!-- FORM -->

          <section class="checkout__form">
            <div class="checkout__header">
              <p class="checkout__eyebrow">Secure checkout</p>

              <h1 class="checkout__title">Complete your order.</h1>
            </div>

            <!-- CONTACT -->

            <div class="checkout__section">
              <h2 class="checkout__section-title">Contact information</h2>

              <div class="form-field">
                <label for="email"> Email </label>

                <input
                  id="email"
                  type="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
            </div>

            <!-- SHIPPING -->

            <div class="checkout__section">
              <h2 class="checkout__section-title">Shipping address</h2>

              <div class="form-grid">
                <div class="form-field">
                  <label for="first-name"> First name </label>

                  <input id="first-name" type="text" required />
                </div>

                <div class="form-field">
                  <label for="last-name"> Last name </label>

                  <input id="last-name" type="text" required />
                </div>
              </div>

              <div class="form-field">
                <label for="address"> Address </label>

                <input id="address" type="text" required />
              </div>

              <div class="form-grid">
                <div class="form-field">
                  <label for="city"> City </label>

                  <input id="city" type="text" required />
                </div>

                <div class="form-field">
                  <label for="zip"> ZIP code </label>

                  <input id="zip" type="text" required />
                </div>
              </div>

              <div class="form-field">
                <label for="country"> Country </label>

                <select id="country" required>
                  <option value="">Select country</option>

                  <option value="US">United States</option>

                  <option value="CA">Canada</option>
                </select>
              </div>
            </div>

            <!-- PAYMENT -->

            <div class="checkout__section">
              <h2 class="checkout__section-title">Payment</h2>

              <div class="payment-box">
                <p>Secure payment</p>

                <span> Payment integration will be connected later. </span>
              </div>
            </div>

            <button
              class="button button--primary checkout__submit"
              type="submit"
              id="place-order"
            >
              Place order
            </button>
          </section>

          <!-- ORDER SUMMARY -->

          <aside class="checkout__summary">
            <h2 class="checkout__summary-title">Your order</h2>

            <div class="checkout__products" id="checkout-products"></div>

            <div class="checkout__summary-divider"></div>

            <div class="checkout__summary-row">
              <span> Subtotal </span>

              <span id="checkout-subtotal"> $0.00 </span>
            </div>

            <div class="checkout__summary-row">
              <span> Shipping </span>

              <span> Free </span>
            </div>

            <div class="checkout__summary-total">
              <span> Total </span>

              <span id="checkout-total"> $0.00 </span>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
  </body>
</html>
